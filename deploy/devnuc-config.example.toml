[app]
data_dir = "/home/your-user/.local/share/asmr-tg-backup"
poll_interval_seconds = 1800
download_delay_seconds = 300
max_items_per_poll = 3
max_attempts = 5
retry_seconds = 1800
live_retry_seconds = 900
worker_count = 1
worker_poll_interval_seconds = 2
job_lease_seconds = 900
log_level = "INFO"

# Optional media proxy. The empty URL and false scopes keep this example direct.
# For a local HTTP proxy, set url="http://127.0.0.1:7890" and enable both scopes.
# Use url_env instead when the URL contains credentials; its value
# belongs in the service's mode-0600 EnvironmentFile. SOCKS is downloads-only
# and is not guaranteed for Twitch live traffic delegated to ffmpeg.
[proxy]
url = ""
url_env = ""
sources = false
downloads = false

[[origins]]
id = "youtube-placeholder"
provider = "youtube"
kind = "uploads"
name = "YouTube ASMR placeholder"
external_id = "UC_CHANNEL_ID"
bootstrap = "latest"
enabled = false

# Twitch VOD/live placeholder. Supply the credentials only through the
# environment variables named in [twitch].
[[origins]]
id = "twitch-placeholder"
provider = "twitch"
kind = "vods"
name = "Twitch ASMR placeholder"
external_id = "twitch_login_or_numeric_broadcaster_id"
bootstrap = "latest"
enabled = false
# Only twitch/vods supports this per-origin override. Panel-managed Twitch
# channels store the same choice in SQLite.
# recording_mode = "live"

[download]
yt_dlp = "/home/your-user/dev/asmr-tg-backup/.venv/bin/yt-dlp"
ffmpeg = "/usr/bin/ffmpeg"
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"
output_template = "%(uploader|unknown)s/%(upload_date>%Y-%m-%d|unknown)s_%(title).80B_%(id)s.%(ext)s"
archive_file = "download-archive.txt"
restrict_filenames = false
write_info_json = true
write_thumbnail = true
probe_timeout_seconds = 180
download_timeout_seconds = 21600
ffmpeg_timeout_seconds = 7200
extra_args = []

# Twitch keeps audio only; no source video master is retained.
[download.provider_profiles.twitch]
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"

[telegram]
enabled = false
bot_token = ""
chat_id = "@your_channel"
api_base = "https://api.telegram.org"
media_type = "audio"
send_as_document = false
max_upload_bytes = 52428800
upload_timeout_seconds = 7200
caption_template = "{title}\n\n{url}\n\n#{tag}"

# Configure the user service with a mode-0600 EnvironmentFile containing
# TWITCH_CLIENT_ID and either TWITCH_ACCESS_TOKEN or TWITCH_CLIENT_SECRET.
[twitch]
client_id_env = "TWITCH_CLIENT_ID"
access_token_env = "TWITCH_ACCESS_TOKEN"
client_secret_env = "TWITCH_CLIENT_SECRET"
request_timeout_seconds = 30
max_pages_per_poll = 3
# Fallback for Twitch vods origins without their own recording_mode. The panel
# persists its live/vod selection per bot-managed channel in SQLite.
recording_mode = "vod"
live_poll_interval_seconds = 30
live_retry_seconds = 15
live_worker_count = 1
# 0 disables the wall-clock timeout for long-running live recordings.
live_download_timeout_seconds = 0

[control]
enabled = false
# Telegram getUpdates long-poll window; accepted range is 1-30 seconds.
poll_interval_seconds = 10
# Close the inline panel after one idle hour. 0 keeps it active indefinitely.
panel_idle_timeout_seconds = 3600
# Browsing local resources is read-only unless this is explicitly enabled.
allow_disk_delete = false
delete_webhook_on_startup = true
default_routes = ["live"]
# Each /panel sends a fresh message; navigation edits that current message.
# The panel state survives service restarts.
# Authorization requires every configured dimension to match. Empty dimensions
# are ignored, and an entirely empty set denies every command.
allowed_user_ids = []
allowed_chat_ids = []
allowed_message_thread_ids = []
