[app]
data_dir = "/home/dreaife/.local/share/ytb-tg-backup"
poll_interval_seconds = 1800
download_delay_seconds = 300
max_items_per_poll = 3
max_attempts = 5
retry_seconds = 1800
live_retry_seconds = 900
log_level = "INFO"

[[channels]]
id = "asmr-placeholder"
name = "ASMR placeholder"
channel_id = "UC_CHANNEL_ID"
routes = ["live"]
enabled = false

[download]
yt_dlp = "/home/dreaife/dev/ytb-tg-backup/.venv/bin/yt-dlp"
ffmpeg = "/usr/bin/ffmpeg"
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"
output_template = "%(uploader|unknown)s/%(upload_date>%Y-%m-%d|unknown)s_%(title).80B_%(id)s.%(ext)s"
archive_file = "download-archive.txt"
restrict_filenames = false
write_info_json = true
write_thumbnail = true
extra_args = []

[telegram]
enabled = false
bot_token = ""
chat_id = "@your_channel"
api_base = "https://api.telegram.org"
media_type = "audio"
send_as_document = false
max_upload_bytes = 52428800
caption_template = "{title}\n\n{url}\n\n#{tag}"

[control]
enabled = false
poll_interval_seconds = 10
delete_webhook_on_startup = true
default_routes = ["live"]
allowed_user_ids = []
allowed_chat_ids = []
allowed_message_thread_ids = []
