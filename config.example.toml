[app]
data_dir = "~/.local/share/asmr-tg-backup"
poll_interval_seconds = 1800
download_delay_seconds = 300
max_items_per_poll = 3
max_attempts = 5
retry_seconds = 1800
live_retry_seconds = 900
worker_count = 1
worker_poll_interval_seconds = 2
job_lease_seconds = 900
log_level = "INFO"

# Origins are provider-backed remote sources. IDs must be unique within this
# config. bootstrap="latest" makes only the newest matching first-seen item
# eligible; use bootstrap="all" only when an intentional backfill is wanted.
[[origins]]
id = "youtube-example"
provider = "youtube"
kind = "uploads"
name = "Example YouTube ASMR channel"
external_id = "UC_CHANNEL_ID"
bootstrap = "latest"
enabled = false

# Twitch archived broadcasts or active live streams discovered through Helix.
# The broadcaster may be a numeric user ID, login, or @login. Credentials are
# read from the environment variables named in [twitch], never from this example.
[[origins]]
id = "twitch-example"
provider = "twitch"
kind = "vods"
name = "Example Twitch ASMR broadcaster"
external_id = "twitch_login_or_numeric_broadcaster_id"
bootstrap = "latest"
enabled = false
# Optional per-origin override. "vod" discovers the archived broadcast after
# the stream; "live" checks /helix/streams and records while the channel is live.
# recording_mode = "live"

# Legacy [[channels]] and [[feeds]] remain supported and are translated into
# origins at load time. Prefer [[origins]] for new configuration.
#
# [[channels]]
# id = "legacy-youtube-example"
# name = "Legacy YouTube channel"
# channel_id = "UC_CHANNEL_ID"
# routes = ["live"]
# enabled = false

# Generic RSS is an escape hatch. Entry media URLs are restricted to public
# HTTP(S) addresses. allowed_media_hosts is optional but recommended; wildcard
# entries such as "*.cdn.example" match subdomains only.
# [[origins]]
# id = "rss-example"
# provider = "rss"
# kind = "feed"
# name = "Example media feed"
# external_id = "https://feeds.example/media.xml"
# allowed_media_hosts = ["media.example", "*.cdn.example"]
# allow_private_media = false
# enabled = false

[download]
yt_dlp = "yt-dlp"
ffmpeg = "ffmpeg"
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"
output_template = "%(uploader|unknown)s/%(upload_date>%Y-%m-%d|unknown)s_%(title).80B_%(id)s.%(ext)s"
archive_file = "download-archive.txt"
restrict_filenames = false
write_info_json = true
write_thumbnail = true
probe_timeout_seconds = 180
download_timeout_seconds = 21600
ffmpeg_timeout_seconds = 7200
extra_args = []

# Twitch also archives audio only. It keeps a provider-specific yt-dlp archive
# file and download directory, but does not retain the source video. This
# profile is used for both VOD downloads and live recordings.
[download.provider_profiles.twitch]
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"

[telegram]
enabled = false
bot_token = ""
chat_id = "@your_channel"
api_base = "https://api.telegram.org"
media_type = "audio"
send_as_document = false
max_upload_bytes = 52428800
upload_timeout_seconds = 7200
caption_template = "{title}\n\n{url}\n\n#{tag}"

# Experimental anonymous YouTube membership discovery and text notifications.
# This path never accepts cookies/auth arguments and never queues downloads.
# origin_ids is an explicit allowlist of disabled, dev-only YouTube uploads or
# vod_after_live origins declared above. Keep both switches false by default.
[dev.youtube_membership]
enabled = false
notify = false
origin_ids = []
yt_dlp = "yt-dlp"
poll_interval_seconds = 1800
request_timeout_seconds = 180
request_spacing_seconds = 5.0
tab_limit = 30
# Leave empty to use telegram.chat_id when notify=true.
chat_id = ""

# Twitch VOD/live discovery requires TWITCH_CLIENT_ID plus either an existing
# TWITCH_ACCESS_TOKEN or TWITCH_CLIENT_SECRET for app-token creation/refresh.
# Put secret values in the process environment or a mode-0600 systemd
# EnvironmentFile; do not add client_id/access_token/client_secret values here.
[twitch]
client_id_env = "TWITCH_CLIENT_ID"
access_token_env = "TWITCH_ACCESS_TOKEN"
client_secret_env = "TWITCH_CLIENT_SECRET"
request_timeout_seconds = 30
max_pages_per_poll = 3
# "vod" waits for an archived broadcast. "live" detects an active stream with
# Helix Get Streams and starts yt-dlp immediately. An origin-level
# recording_mode overrides this fallback default. Telegram-panel origins store
# their selected per-channel mode in SQLite instead of changing this file.
recording_mode = "vod"
live_poll_interval_seconds = 30
live_retry_seconds = 15
live_worker_count = 1
# 0 means no fixed wall-clock limit; service stop and lease loss still terminate
# yt-dlp cleanly and leave the job retryable.
live_download_timeout_seconds = 0

[control]
enabled = false
# Telegram getUpdates long-poll window; accepted range is 1-30 seconds.
poll_interval_seconds = 10
# Close the inline panel after this many seconds without a valid interaction.
# Each button press or accepted text input renews the timer. 0 disables expiry.
panel_idle_timeout_seconds = 3600
# Resource browsing is always available. Keep permanent local file deletion
# disabled until the authorized panel operator explicitly needs it.
allow_disk_delete = false
delete_webhook_on_startup = true
default_routes = ["live"]
# Every /panel command sends a fresh panel below the command; navigation edits
# that current message. Its state is persisted and scoped to user + chat + thread.
# Every non-empty allowlist below must match. Empty dimensions are ignored; if
# all three are empty, every control command is denied.
allowed_user_ids = []
allowed_chat_ids = []
allowed_message_thread_ids = []
