[app]
# ASMR_TG_BACKUP_DATA_DIR overrides this value, which is useful in containers.
data_dir = "~/.local/share/asmr-tg-backup"
poll_interval_seconds = 1800
download_delay_seconds = 300
max_items_per_poll = 3
max_attempts = 5
retry_seconds = 1800
live_retry_seconds = 900
worker_count = 1
worker_poll_interval_seconds = 2
job_lease_seconds = 900
log_level = "INFO"

[storage]
# Delete verified live segments after merge.
# Delete Telegram upload derivatives after delivery.
process_retention_hours = 24
# Keep complete backup files. Set a positive number to expire them.
backup_retention_hours = 0
# Optional: move complete backup files to a mounted storage directory.
archive_dir = ""
archive_after_delivery_hours = 24
# Leave enabled when archive_dir is on a mounted disk.
archive_require_mount = true

# The Telegram panel is the easiest way to manage sources. It writes this
# catalog atomically; advanced users can edit the file and run `sources apply`.
[sources]
path = "sources.toml"

# Optional packages are discovered through Python entry points. Installation
# alone changes nothing. Trusted extensions can be installed and enabled with
# `asmr-tg-backup extensions enable <short-name>`; the command keeps its state
# in a private sidecar and does not rewrite this file. Advanced users can still
# opt in here and validate with `asmr-tg-backup extensions doctor`.
[extensions]
enabled = []

# Keep plugin secrets and subscription URLs in a private file beside this
# config, then enable its ID above.
# [extensions."dreaife.proxy-router"]
# required = true
# config_file = "proxy.toml"

[download]
yt_dlp = "yt-dlp"
ffmpeg = "ffmpeg"
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"
output_template = "%(uploader|unknown)s/%(upload_date>%Y-%m-%d|unknown)s_%(title).80B_%(id)s.%(ext)s"
archive_file = "download-archive.txt"
restrict_filenames = false
write_info_json = true
write_thumbnail = true
probe_timeout_seconds = 180
download_timeout_seconds = 21600
ffmpeg_timeout_seconds = 7200
extra_args = []

# Twitch also archives audio only. It keeps a provider-specific yt-dlp archive
# file and download directory, but does not retain the source video. This
# profile is used for both VOD downloads and live recordings.
[download.provider_profiles.twitch]
format = "bestaudio/best"
merge_output_format = ""
extract_audio = true
audio_format = "m4a"
audio_quality = "0"

[telegram]
enabled = false
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID override these deployment values.
bot_token = ""
chat_id = "@your_channel"
# New installations upload media directly over MTProto by default.
upload_transport = "mtproto"
media_type = "audio"
send_as_document = false
upload_timeout_seconds = 7200
caption_template = "{title}\n\n{url}\n\n#{tag}"

[telegram.mtproto]
# Official PyPI/GHCR installations can leave application credentials unset.
# Source builds and custom credentials must provide both values here or through
# ASMR_TG_MTPROTO_API_ID/HASH. Never configure only one half of the pair.
# api_id = 123456
# api_hash = "0123456789abcdef0123456789abcdef"
session_path = "telegram-mtproto.session"
max_upload_bytes = 1990000000

[telegram.bot_api]
# Used whenever upload_transport="bot_api" and as the control bot fallback.
# TELEGRAM_API_BASE and TELEGRAM_MAX_UPLOAD_BYTES override these values.
api_base = "https://api.telegram.org"
max_upload_bytes = 49000000
# Splitting is a Bot API oversize policy, not a separate upload transport.
split_large_audio = true
max_upload_parts = 10

# Twitch VOD/live discovery requires TWITCH_CLIENT_ID plus either an existing
# TWITCH_ACCESS_TOKEN or TWITCH_CLIENT_SECRET for app-token creation/refresh.
# Put secret values in the process environment or a mode-0600 systemd
# EnvironmentFile; do not add client_id/access_token/client_secret values here.
[twitch]
client_id_env = "TWITCH_CLIENT_ID"
access_token_env = "TWITCH_ACCESS_TOKEN"
client_secret_env = "TWITCH_CLIENT_SECRET"
request_timeout_seconds = 30
max_pages_per_poll = 3
# "vod" waits for an archived broadcast. "live" detects an active stream with
# Helix Get Streams and starts yt-dlp immediately. An origin-level
# recording_mode overrides this fallback default in sources.toml.
recording_mode = "vod"

# Fast polling and the isolated recording lane are shared by every live source
# provider, including extensions.
[live]
poll_interval_seconds = 30
retry_seconds = 15
worker_count = 1
# 0 means no fixed wall-clock limit; service stop and lease loss still terminate
# yt-dlp cleanly and leave the job retryable.
download_timeout_seconds = 0

[control]
enabled = false
# Optional control-only Bot API endpoint. Empty inherits
# telegram.bot_api.api_base. Use only a trusted endpoint because it receives
# the bot token; loopback HTTP endpoints are forced direct.
api_base = ""
# Telegram getUpdates long-poll window; accepted range is 1-30 seconds.
poll_interval_seconds = 10
# Close the inline panel after this many seconds without a valid interaction.
# Each button press or accepted text input renews the timer. 0 disables expiry.
panel_idle_timeout_seconds = 3600
# Resource browsing is always available. Keep permanent local file deletion
# disabled until the authorized panel operator explicitly needs it.
allow_disk_delete = false
delete_webhook_on_startup = true
# Every /panel command sends a fresh panel below the command; navigation edits
# that current message. Its state is persisted and scoped to user + chat + thread.
# Every non-empty allowlist below must match. Empty dimensions are ignored; if
# all three are empty, every control command is denied.
allowed_user_ids = []
allowed_chat_ids = []
allowed_message_thread_ids = []
