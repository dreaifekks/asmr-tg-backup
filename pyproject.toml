[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytb-tg-backup"
version = "0.1.0"
description = "Poll YouTube official channel feeds, archive videos with yt-dlp, and optionally upload them to Telegram."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ytb-tg-backup = "ytb_tg_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
