[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytb-tg-backup"
version = "0.2.0"
description = "Discover public media from provider-backed origins, archive it with yt-dlp, and optionally deliver it to Telegram."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
ytb-tg-backup = "ytb_tg_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
