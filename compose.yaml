name: asmr-tg-backup

services:
  asmr-tg-backup:
    image: ${ASMR_TG_BACKUP_IMAGE:-asmr-tg-backup:local}
    build:
      context: .
      target: source-runtime
      args:
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    command: ["run", "--config", "/config/config.toml"]
    environment:
      ASMR_TG_BACKUP_DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ASMR_TG_UPLOAD_TRANSPORT: ${ASMR_TG_UPLOAD_TRANSPORT:-mtproto}
      ASMR_TG_MTPROTO_API_ID: ${ASMR_TG_MTPROTO_API_ID:-}
      ASMR_TG_MTPROTO_API_HASH: ${ASMR_TG_MTPROTO_API_HASH:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_MAX_UPLOAD_BYTES: ${TELEGRAM_MAX_UPLOAD_BYTES:-49000000}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_ACCESS_TOKEN: ${TWITCH_ACCESS_TOKEN:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      NO_PROXY: localhost,127.0.0.1,::1,telegram-bot-api
      no_proxy: localhost,127.0.0.1,::1,telegram-bot-api
    volumes:
      - ./config.toml:/config/config.toml:ro
      - asmr-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  telegram-bot-api:
    profiles: ["local-api"]
    image: ${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:${TELEGRAM_BOT_API_PORT:-18081}:8081"
      - "127.0.0.1:${TELEGRAM_BOT_API_STATS_PORT:-18082}:8082"

volumes:
  asmr-data:
  telegram-bot-api-data:
